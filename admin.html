<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevKart Admin Control Panel</title>
<style>
:root{--g:#075d2c;--g2:#0b6a33;--gold:#bd6b08;--bg:#f4f7f5;--line:#e2e8e3;--text:#14231a;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--g);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.brand span{color:#f3bd55}.wrap{max-width:1400px;margin:auto;padding:18px}.login{max-width:420px;margin:70px auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #0001}.login h1{margin-top:0}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:var(--g);color:#fff}.danger{background:#fff0ef;color:var(--red);border:1px solid #f2c6c2}.muted{color:#65736a;font-size:13px}.error{color:var(--red);font-weight:700;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;padding:18px;border-radius:14px;border:1px solid var(--line)}.stat b{font-size:27px;display:block;margin-top:7px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:9px;font-weight:800}.nav button.active{background:var(--g);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.panelhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:12px;color:#526058;background:#f8faf8}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf7ef;font-size:12px;font-weight:800}.productform{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#14231a;color:#fff;padding:12px 16px;border-radius:10px;display:none}.empty{padding:25px;text-align:center;color:#69766e}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.productform{grid-template-columns:1fr}.wrap{padding:12px}.top{gap:10px}.brand{font-size:18px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.stat b{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const DEFAULT_ADMIN_USER='admin',DEFAULT_ADMIN_PASS='admin123';
const defaultProducts=[
{id:1,n:'Ashwagandha Powder',c:'Herbs',p:199,o:299,s:50,img:'ashwagandha.jpg',d:'Traditionally used for strength, stamina and overall wellness.'},
{id:2,n:'Safed Musli Powder',c:'Herbs',p:249,o:349,s:40,img:'safed-musli.jpg',d:'Traditional Ayurvedic herb used for vitality and general wellness.'},
{id:3,n:'Shatavari Powder',c:'Herbs',p:199,o:299,s:45,img:'shatavari.jpg',d:"Traditional herb used for women's wellness and nourishment."},
{id:4,n:'Kaunch Beej Powder',c:'Herbs',p:199,o:299,s:35,img:'kaunch-beej.jpg',d:'Traditional seed powder used for vitality and general wellness.'},
{id:5,n:'Gokhru Powder',c:'Herbs',p:149,o:199,s:30,img:'gokhru.jpg',d:'Traditional Ayurvedic herb used in wellness preparations.'},
{id:6,n:'Desi Cow Ghee',c:'Desi Cow & Havan',p:599,o:799,s:50,img:'cow-ghee.jpg',d:'Pure desi cow ghee for traditional food, wellness and puja use.'},
{id:7,n:'Cow Kanda',c:'Desi Cow & Havan',p:199,o:249,s:50,img:'cow-kanda.jpg',d:'Traditional cow dung cakes for puja and havan rituals.'},
{id:8,n:'Havan Ki Lakdi',c:'Desi Cow & Havan',p:299,o:349,s:50,img:'havan-wood.jpg',d:'Natural wood prepared for traditional havan and puja rituals.'},
{id:9,n:'Havan Samagri',c:'Desi Cow & Havan',p:149,o:199,s:50,img:'havan-samagri.jpg',d:'Traditional blend of havan ingredients for puja and yajna.'}
];
defaultProducts.forEach(p=>{if(!Array.isArray(p.images))p.images=[];if(p.active===undefined)p.active=true;if(p.featured===undefined)p.featured=false;if(!p.w)p.w="";if(!p.sku)p.sku=""});
let products=load('devkart_products',defaultProducts), tab='dashboard', editId=null;
function syncAdmin(){products=load('devkart_products',defaultProducts);if(isAdmin())render()}
window.addEventListener('storage',e=>{if(['devkart_products','devkart_orders','devkart_users'].includes(e.key))syncAdmin()});
window.addEventListener('focus',syncAdmin);
function load(k,f){try{let x=JSON.parse(localStorage.getItem(k));return x??f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function isAdmin(){return sessionStorage.getItem('devkart_admin')==='1'}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login"><h1>🌿 DevKart Admin</h1><p class="muted">Control panel for products, orders and customers.</p><div class="field"><label>Admin Username</label><input id="au" value="admin"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><div id="err" class="error"></div><button class="btn primary" style="width:100%" onclick="login()">Login to Control Panel</button><p class="muted" style="margin-top:14px">Demo login: <b>admin / admin123</b></p></div>`}
function login(){if(document.getElementById('au').value===DEFAULT_ADMIN_USER&&document.getElementById('ap').value===DEFAULT_ADMIN_PASS){sessionStorage.setItem('devkart_admin','1');render()}else document.getElementById('err').textContent='Invalid admin username or password.'}
function logout(){sessionStorage.removeItem('devkart_admin');renderLogin()}
function render(){if(!isAdmin())return renderLogin();let users=load('devkart_users',[]),orders=load('devkart_orders',[]);document.getElementById('app').innerHTML=`
<div class="top"><div class="brand">Dev<span>Kart</span> Admin</div><button class="btn" onclick="logout()">Logout</button></div>
<div class="wrap"><div class="nav">
<button class="${tab==='dashboard'?'active':''}" onclick="tab='dashboard';render()">📊 Dashboard</button>
<button class="${tab==='products'?'active':''}" onclick="tab='products';render()">📦 Products</button>
<button class="${tab==='orders'?'active':''}" onclick="tab='orders';render()">🧾 Orders</button>
<button class="${tab==='customers'?'active':''}" onclick="tab='customers';render()">👥 Customers</button>
<button onclick="window.open('index.html','_blank')">🛍️ Open Store</button></div>
${tab==='dashboard'?dashboard(users,orders):tab==='products'?productPanel():tab==='orders'?orderPanel(orders):customerPanel(users)}
</div>`}
function dashboard(users,orders){let revenue=orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+Number(o.total||0),0),pending=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length,low=products.filter(p=>Number(p.s)<=10).length;return `<h2>Dashboard</h2><div class="grid"><div class="stat">Products<b>${products.length}</b><span class="muted">Active catalog</span></div><div class="stat">Customers<b>${users.length}</b><span class="muted">Registered users</span></div><div class="stat">Orders<b>${orders.length}</b><span class="muted">${pending} active</span></div><div class="stat">Sales<b>₹${revenue.toLocaleString('en-IN')}</b><span class="muted">${low} low-stock products</span></div></div><div class="panel" style="margin-top:16px"><h3>Quick actions</h3><div class="actions"><button class="btn primary" onclick="tab='products';editId=null;render()">+ Add Product</button><button class="btn" onclick="tab='orders';render()">Manage Orders</button><button class="btn" onclick="tab='customers';render()">View Customers</button><button class="btn" onclick="backupData()">Backup Data</button></div></div><div class="panel"><h3>Important</h3><p class="muted">Courier details can be added per order (courier name, AWB/tracking number, tracking URL and expected delivery date). Customer will see these in My Orders. This version syncs automatically between the store and control panel when both are open in the same browser/device. Data is stored only in that browser's localStorage. For multi-device control, a real backend/database is required.</p></div>`}
function productPanel(){return `<div class="panel"><div class="panelhead"><h2 style="margin:0">${editId?'Edit Product':'Products'}</h2><div class="actions"><button class="btn primary" onclick="startAdd()">+ Add Product</button><button class="btn" onclick="resetProducts()">Reset Defaults</button></div></div>${editId?productForm():productTable()}</div>`}
function productTable(){return `<div class="tablewrap"><table class="table"><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>MRP</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>${products.map(p=>`<tr><td><img class="thumb" src="${esc(p.img)}"></td><td><b>${esc(p.n)}</b><br><span class="muted">ID ${p.id}</span></td><td>${esc(p.c)}</td><td>₹${p.p}</td><td>₹${p.o}</td><td><span class="badge">${p.s}</span></td><td><span class="badge">${p.active===false?'Hidden':'Active'}</span>${p.featured?' ⭐':''}</td><td><div class="actions"><button class="btn" onclick="editProduct(${p.id})">Edit</button><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function productForm(){let p=products.find(x=>x.id===editId)||{n:'',c:'Herbs',p:'',o:'',s:'',img:'',images:[],d:'',w:'',sku:'',active:true,featured:false};let gallery=Array.isArray(p.images)?p.images:[];return `<div class="productform">
<div class="field"><label>Product Name</label><input id="pn" value="${esc(p.n)}" autocomplete="off"></div>
<div class="field"><label>Category</label><select id="pc"><option ${p.c==='Herbs'?'selected':''}>Herbs</option><option ${p.c==='Desi Cow & Havan'?'selected':''}>Desi Cow & Havan</option></select></div>
<div class="field"><label>Selling Price (₹)</label><input id="pp" type="number" min="0" value="${p.p}"></div>
<div class="field"><label>MRP (₹)</label><input id="po" type="number" min="0" value="${p.o}"></div>
<div class="field"><label>Stock</label><input id="ps" type="number" min="0" value="${p.s}"></div>
<div class="field"><label>Net Weight</label><input id="pw" value="${esc(p.w||'')}" placeholder="100g / 250g / 1kg"></div>
<div class="field"><label>SKU / Product Code</label><input id="psku" value="${esc(p.sku||'')}" placeholder="DEV-ASH-100"></div>
<div class="field"><label>Main Image filename/URL</label><input id="pi" value="${esc(p.img)}" placeholder="example.jpg or image URL" oninput="previewMainImage()"></div>
<div class="field"><label>Upload Main Image</label><input id="pifile" type="file" accept="image/*" onchange="readImageFile(this,'main')"></div>
<div class="field full"><div id="imagePreview" class="imagePreview">${p.img?`<img src="${esc(p.img)}" alt="Preview">`: '<span>No image selected</span>'}</div></div>
<div class="field full"><label>Gallery Images (up to 5)</label><input id="pgfiles" type="file" accept="image/*" multiple onchange="readGalleryFiles(this)"><small class="muted">You can also use the existing filename pattern; uploaded images are stored in this browser until an online storage/database is connected.</small><div id="galleryPreview" class="galleryPreview">${gallery.map((im,i)=>`<div><img src="${esc(im)}"><button type="button" class="btn danger" onclick="removeGallery(${i})">Remove</button></div>`).join('')}</div></div>
<div class="field"><label>Product Status</label><select id="pactive"><option value="1" ${p.active!==false?'selected':''}>Active / Show on Store</option><option value="0" ${p.active===false?'selected':''}>Hidden / Do not show</option></select></div>
<div class="field"><label>Featured</label><select id="pfeatured"><option value="0" ${!p.featured?'selected':''}>Normal</option><option value="1" ${p.featured?'selected':''}>Featured / Popular</option></select></div>
<div class="field full"><label>Description</label><textarea id="pd" rows="4">${esc(p.d)}</textarea></div>
<div class="full actions"><button class="btn primary" onclick="saveProduct()">Save Product</button><button class="btn" onclick="editId=null;render()">Cancel</button></div></div>`}
let pendingMainImage=null,pendingGalleryImages=[];
function readImageFile(input,kind){let f=input.files?.[0];if(!f)return;if(f.size>4*1024*1024){alert('Image should be 4 MB or smaller.');input.value='';return}let r=new FileReader();r.onload=()=>{if(kind==='main'){pendingMainImage=r.result;document.getElementById('pi').value=r.result;previewMainImage()} };r.readAsDataURL(f)}
function readGalleryFiles(input){pendingGalleryImages=[];let files=[...(input.files||[])].slice(0,5);if((input.files||[]).length>5)alert('Maximum 5 gallery images allowed.');let done=0;files.forEach(f=>{if(f.size>4*1024*1024){done++;return}let r=new FileReader();r.onload=()=>{pendingGalleryImages.push(r.result);done++;if(done===files.length)renderGalleryPreview();};r.readAsDataURL(f)});if(!files.length)renderGalleryPreview()}
function previewMainImage(){let v=document.getElementById('pi')?.value.trim(),box=document.getElementById('imagePreview');if(box)box.innerHTML=v?`<img src="${esc(v)}" alt="Preview" onerror="this.parentElement.innerHTML='<span>Image could not be previewed</span>'">`:'<span>No image selected</span>'}
function renderGalleryPreview(){let box=document.getElementById('galleryPreview');if(!box)return;let p=products.find(x=>x.id===editId)||{},old=Array.isArray(p.images)?p.images:[];box.innerHTML=[...old,...pendingGalleryImages].map((im,i)=>`<div><img src="${esc(im)}"><button type="button" class="btn danger" onclick="removeGallery(${i})">Remove</button></div>`).join('')}
function removeGallery(i){let p=products.find(x=>x.id===editId)||{},old=Array.isArray(p.images)?[...p.images]:[];if(i<old.length)old.splice(i,1);else pendingGalleryImages.splice(i-old.length,1);if(p.id){p.images=old;products=products.map(x=>x.id===p.id?p:x)}renderGalleryPreview()}
function startAdd(){pendingMainImage=null;pendingGalleryImages=[];editId='new';render()}
function editProduct(id){pendingMainImage=null;pendingGalleryImages=[];editId=id;render()}
function saveProduct(){let n=document.getElementById('pn').value.trim(),p=Number(document.getElementById('pp').value),o=Number(document.getElementById('po').value),s=Number(document.getElementById('ps').value),img=document.getElementById('pi').value.trim(),d=document.getElementById('pd').value.trim(),c=document.getElementById('pc').value,w=document.getElementById('pw').value.trim(),sku=document.getElementById('psku').value.trim(),active=document.getElementById('pactive').value==='1',featured=document.getElementById('pfeatured').value==='1';if(!n||!img||p<0||o<0||s<0){alert('Please fill Product Name, Image, Price, MRP and Stock correctly.');return}if(p>o){alert('Selling price should not be greater than MRP.');return}let existing=editId==='new'?null:products.find(x=>x.id===editId),images=existing&&Array.isArray(existing.images)?[...existing.images]:[];images=[...images,...pendingGalleryImages].slice(0,5);let data={id:existing?.id??(products.length?Math.max(...products.map(x=>Number(x.id)))+1:1),n,c,p,o,s,img,d,w,sku,active,featured,images};if(existing)Object.assign(existing,data);else products.push(data);save('devkart_products',products);pendingMainImage=null;pendingGalleryImages=[];editId=null;toast('Product saved');render()}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p||!confirm('Delete '+p.n+'?'))return;products=products.filter(x=>x.id!==id);save('devkart_products',products);toast('Product deleted');render()}
function resetProducts(){if(confirm('Reset catalog to the original 9 products?')){products=defaultProducts.map(x=>({...x}));save('devkart_products',products);toast('Catalog reset');render()}}
function orderPanel(orders){return `<div class="panel"><div class="panelhead"><h2 style="margin:0">Orders (${orders.length})</h2><div class="actions"><button class="btn" onclick="exportOrders()">Export CSV</button><button class="btn" onclick="render()">Refresh</button></div></div>${orders.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Order</th><th>Customer / Address</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th></tr></thead><tbody>${orders.slice().reverse().map(o=>`<tr><td><b>${esc(o.id)}</b><br><span class="muted">${esc(o.payment||'COD')}</span></td><td>${esc(o.address?.name||'Customer')}<br>${esc(o.address?.mobile||'')}<br><span class="muted">${esc(o.address?.city||o.address?.address||'')}</span></td><td>${(o.items||[]).map(i=>{let p=products.find(p=>p.id===i.id);return esc(i.n||(p?p.n:'Product'))+' × '+i.q}).join('<br>')}</td><td><b>₹${Number(o.total||0).toLocaleString('en-IN')}</b></td><td>${esc(o.date||'')}</td><td><select onchange="setOrderStatus('${esc(o.id)}',this.value)">${['Confirmed','Packed','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><div style="margin-top:8px;min-width:230px"><input id="courier-${esc(o.id)}" value="${esc(o.courier?.name||'')}" placeholder="Courier name" style="width:100%;padding:7px;border:1px solid #ccd8ce;border-radius:7px;margin-bottom:5px"><input id="awb-${esc(o.id)}" value="${esc(o.courier?.awb||'')}" placeholder="AWB / Tracking No." style="width:100%;padding:7px;border:1px solid #ccd8ce;border-radius:7px;margin-bottom:5px"><input id="track-${esc(o.id)}" value="${esc(o.courier?.url||'')}" placeholder="Tracking URL" style="width:100%;padding:7px;border:1px solid #ccd8ce;border-radius:7px;margin-bottom:5px"><input id="edd-${esc(o.id)}" type="date" value="${esc(o.courier?.expected||'')}" style="width:100%;padding:7px;border:1px solid #ccd8ce;border-radius:7px;margin-bottom:5px"><button class="btn primary" onclick="saveCourier('${esc(o.id)}')">Save Courier</button></div>${o.courier?.name?`<div class="badge" style="margin-top:6px">🚚 ${esc(o.courier.name)} ${o.courier.awb?'· '+esc(o.courier.awb):''}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders yet.</div>'}</div>`}
function backupData(){let keys=['devkart_products','devkart_users','devkart_orders','devkart_addresses','devkart_address','devkart_wishlist'];let out={};keys.forEach(k=>{let v=localStorage.getItem(k);if(v!==null)out[k]=v});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='devkart-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}
function exportOrders(){let orders=load('devkart_orders',[]);if(!orders.length){toast('No orders to export');return}let rows=[['Order ID','Date','Status','Payment','Total','Customer Mobile','PIN','City','Address','Items']];orders.forEach(o=>rows.push([o.id,o.date,o.status,o.payment,o.total,o.address?.mobile||'',o.address?.pin||'',o.address?.city||'',o.address?.address||'',(o.items||[]).map(i=>(i.n||'Product')+' x '+i.q).join(' | ')]));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='devkart-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Orders exported')}
function setOrderStatus(id,status){let orders=load('devkart_orders',[]),o=orders.find(x=>x.id===id);if(o){o.status=status;if(status==='Shipped'&&!o.shippedAt)o.shippedAt=new Date().toISOString();save('devkart_orders',orders);toast('Order status updated')}}
function saveCourier(id){let orders=load('devkart_orders',[]),o=orders.find(x=>x.id===id);if(!o)return;let name=document.getElementById('courier-'+id)?.value.trim()||'',awb=document.getElementById('awb-'+id)?.value.trim()||'',url=document.getElementById('track-'+id)?.value.trim()||'',expected=document.getElementById('edd-'+id)?.value||'';if(url&&!/^https?:\/\//i.test(url))url='https://'+url;o.courier={name,awb,url,expected};save('devkart_orders',orders);toast('Courier details saved');render()}
function customerPanel(users){return `<div class="panel"><div class="panelhead"><h2 style="margin:0">Customers (${users.length})</h2><button class="btn" onclick="render()">Refresh</button></div>${users.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Joined</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.name||'—')}</b></td><td>${esc(u.m||'')}</td><td>${esc(u.e||'—')}</td><td>Registered account</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No customers registered yet.</div>'}</div>`}
render();
</script>
</body></html>
