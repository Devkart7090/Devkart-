<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevKart Admin Control Panel</title>
<style>
:root{--g:#075d2c;--g2:#0b6a33;--gold:#bd6b08;--bg:#f4f7f5;--line:#e2e8e3;--text:#14231a;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--g);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.brand span{color:#f3bd55}.wrap{max-width:1400px;margin:auto;padding:18px}.login{max-width:420px;margin:70px auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #0001}.login h1{margin-top:0}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:var(--g);color:#fff}.danger{background:#fff0ef;color:var(--red);border:1px solid #f2c6c2}.muted{color:#65736a;font-size:13px}.error{color:var(--red);font-weight:700;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;padding:18px;border-radius:14px;border:1px solid var(--line)}.stat b{font-size:27px;display:block;margin-top:7px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:9px;font-weight:800}.nav button.active{background:var(--g);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.panelhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:12px;color:#526058;background:#f8faf8}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf7ef;font-size:12px;font-weight:800}.productform{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#14231a;color:#fff;padding:12px 16px;border-radius:10px;display:none}.empty{padding:25px;text-align:center;color:#69766e}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.productform{grid-template-columns:1fr}.wrap{padding:12px}.top{gap:10px}.brand{font-size:18px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.stat b{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const DEFAULT_ADMIN_USER='admin',DEFAULT_ADMIN_PASS='admin123';
const defaultProducts=[
{id:1,n:'Ashwagandha Powder',c:'Herbs',p:199,o:299,s:50,img:'ashwagandha.jpg',d:'Traditionally used for strength, stamina and overall wellness.'},
{id:2,n:'Safed Musli Powder',c:'Herbs',p:249,o:349,s:40,img:'safed-musli.jpg',d:'Traditional Ayurvedic herb used for vitality and general wellness.'},
{id:3,n:'Shatavari Powder',c:'Herbs',p:199,o:299,s:45,img:'shatavari.jpg',d:"Traditional herb used for women's wellness and nourishment."},
{id:4,n:'Kaunch Beej Powder',c:'Herbs',p:199,o:299,s:35,img:'kaunch-beej.jpg',d:'Traditional seed powder used for vitality and general wellness.'},
{id:5,n:'Gokhru Powder',c:'Herbs',p:149,o:199,s:30,img:'gokhru.jpg',d:'Traditional Ayurvedic herb used in wellness preparations.'},
{id:6,n:'Desi Cow Ghee',c:'Desi Cow & Havan',p:599,o:799,s:50,img:'cow-ghee.jpg',d:'Pure desi cow ghee for traditional food, wellness and puja use.'},
{id:7,n:'Cow Kanda',c:'Desi Cow & Havan',p:199,o:249,s:50,img:'cow-kanda.jpg',d:'Traditional cow dung cakes for puja and havan rituals.'},
{id:8,n:'Havan Ki Lakdi',c:'Desi Cow & Havan',p:299,o:349,s:50,img:'havan-wood.jpg',d:'Natural wood prepared for traditional havan and puja rituals.'},
{id:9,n:'Havan Samagri',c:'Desi Cow & Havan',p:149,o:199,s:50,img:'havan-samagri.jpg',d:'Traditional blend of havan ingredients for puja and yajna.'}
];
let products=load('devkart_products',defaultProducts), tab='dashboard', editId=null;
function load(k,f){try{let x=JSON.parse(localStorage.getItem(k));return x??f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function isAdmin(){return sessionStorage.getItem('devkart_admin')==='1'}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login"><h1>🌿 DevKart Admin</h1><p class="muted">Control panel for products, orders and customers.</p><div class="field"><label>Admin Username</label><input id="au" value="admin"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><div id="err" class="error"></div><button class="btn primary" style="width:100%" onclick="login()">Login to Control Panel</button><p class="muted" style="margin-top:14px">Demo login: <b>admin / admin123</b></p></div>`}
function login(){if(document.getElementById('au').value===DEFAULT_ADMIN_USER&&document.getElementById('ap').value===DEFAULT_ADMIN_PASS){sessionStorage.setItem('devkart_admin','1');render()}else document.getElementById('err').textContent='Invalid admin username or password.'}
function logout(){sessionStorage.removeItem('devkart_admin');renderLogin()}
function render(){if(!isAdmin())return renderLogin();let users=load('devkart_users',[]),orders=load('devkart_orders',[]);document.getElementById('app').innerHTML=`
<div class="top"><div class="brand">Dev<span>Kart</span> Admin</div><button class="btn" onclick="logout()">Logout</button></div>
<div class="wrap"><div class="nav">
<button class="${tab==='dashboard'?'active':''}" onclick="tab='dashboard';render()">📊 Dashboard</button>
<button class="${tab==='products'?'active':''}" onclick="tab='products';render()">📦 Products</button>
<button class="${tab==='orders'?'active':''}" onclick="tab='orders';render()">🧾 Orders</button>
<button class="${tab==='customers'?'active':''}" onclick="tab='customers';render()">👥 Customers</button>
<button onclick="window.open('index.html','_blank')">🛍️ Open Store</button></div>
${tab==='dashboard'?dashboard(users,orders):tab==='products'?productPanel():tab==='orders'?orderPanel(orders):customerPanel(users)}
</div>`}
function dashboard(users,orders){let revenue=orders.reduce((a,o)=>a+Number(o.total||0),0),pending=orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length,low=products.filter(p=>Number(p.s)<=10).length;return `<h2>Dashboard</h2><div class="grid"><div class="stat">Products<b>${products.length}</b><span class="muted">Active catalog</span></div><div class="stat">Customers<b>${users.length}</b><span class="muted">Registered users</span></div><div class="stat">Orders<b>${orders.length}</b><span class="muted">${pending} active</span></div><div class="stat">Sales<b>₹${revenue.toLocaleString('en-IN')}</b><span class="muted">${low} low-stock products</span></div></div><div class="panel" style="margin-top:16px"><h3>Quick actions</h3><div class="actions"><button class="btn primary" onclick="tab='products';editId=null;render()">+ Add Product</button><button class="btn" onclick="tab='orders';render()">Manage Orders</button><button class="btn" onclick="tab='customers';render()">View Customers</button></div></div><div class="panel"><h3>Important</h3><p class="muted">This version uses browser localStorage. The control panel and store must be opened on the same browser/device for changes to appear. For a real multi-device admin system, connect a backend/database.</p></div>`}
function productPanel(){return `<div class="panel"><div class="panelhead"><h2 style="margin:0">${editId?'Edit Product':'Products'}</h2><div class="actions"><button class="btn primary" onclick="startAdd()">+ Add Product</button><button class="btn" onclick="resetProducts()">Reset Defaults</button></div></div>${editId?productForm():productTable()}</div>`}
function productTable(){return `<div class="tablewrap"><table class="table"><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>MRP</th><th>Stock</th><th>Actions</th></tr></thead><tbody>${products.map(p=>`<tr><td><img class="thumb" src="${esc(p.img)}"></td><td><b>${esc(p.n)}</b><br><span class="muted">ID ${p.id}</span></td><td>${esc(p.c)}</td><td>₹${p.p}</td><td>₹${p.o}</td><td><span class="badge">${p.s}</span></td><td><div class="actions"><button class="btn" onclick="editProduct(${p.id})">Edit</button><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function productForm(){let p=products.find(x=>x.id===editId)||{n:'',c:'Herbs',p:'',o:'',s:'',img:'',d:''};return `<div class="productform"><div class="field"><label>Product Name</label><input id="pn" value="${esc(p.n)}"></div><div class="field"><label>Category</label><select id="pc"><option ${p.c==='Herbs'?'selected':''}>Herbs</option><option ${p.c==='Desi Cow & Havan'?'selected':''}>Desi Cow & Havan</option></select></div><div class="field"><label>Selling Price (₹)</label><input id="pp" type="number" min="0" value="${p.p}"></div><div class="field"><label>MRP (₹)</label><input id="po" type="number" min="0" value="${p.o}"></div><div class="field"><label>Stock</label><input id="ps" type="number" min="0" value="${p.s}"></div><div class="field"><label>Main Image filename/URL</label><input id="pi" value="${esc(p.img)}" placeholder="example.jpg"></div><div class="field full"><label>Description</label><textarea id="pd" rows="4">${esc(p.d)}</textarea></div><div class="full actions"><button class="btn primary" onclick="saveProduct()">Save Product</button><button class="btn" onclick="editId=null;render()">Cancel</button></div></div>`}
function startAdd(){editId='new';render()}
function editProduct(id){editId=id;render()}
function saveProduct(){let n=document.getElementById('pn').value.trim(),p=Number(document.getElementById('pp').value),o=Number(document.getElementById('po').value),s=Number(document.getElementById('ps').value),img=document.getElementById('pi').value.trim(),d=document.getElementById('pd').value.trim(),c=document.getElementById('pc').value;if(!n||!img||p<0||o<0||s<0){alert('Please fill all product fields correctly.');return}if(p>o){alert('Selling price should not be greater than MRP.');return}if(editId==='new'){let id=products.length?Math.max(...products.map(x=>Number(x.id)))+1:1;products.push({id,n,c,p,o,s,img,d})}else{let x=products.find(x=>x.id===editId);Object.assign(x,{n,c,p,o,s,img,d})}save('devkart_products',products);editId=null;toast('Product saved');render()}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p||!confirm('Delete '+p.n+'?'))return;products=products.filter(x=>x.id!==id);save('devkart_products',products);toast('Product deleted');render()}
function resetProducts(){if(confirm('Reset catalog to the original 9 products?')){products=defaultProducts.map(x=>({...x}));save('devkart_products',products);toast('Catalog reset');render()}}
function orderPanel(orders){return `<div class="panel"><div class="panelhead"><h2 style="margin:0">Orders (${orders.length})</h2><button class="btn" onclick="render()">Refresh</button></div>${orders.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Order</th><th>Customer / Address</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th></tr></thead><tbody>${orders.slice().reverse().map(o=>`<tr><td><b>${esc(o.id)}</b><br><span class="muted">${esc(o.payment||'COD')}</span></td><td>${esc(o.address?.name||'Customer')}<br>${esc(o.address?.mobile||'')}<br><span class="muted">${esc(o.address?.city||o.address?.address||'')}</span></td><td>${(o.items||[]).map(i=>{let p=products.find(p=>p.id===i.id);return esc(p?p.n:'Product')+' × '+i.q}).join('<br>')}</td><td><b>₹${Number(o.total||0).toLocaleString('en-IN')}</b></td><td>${esc(o.date||'')}</td><td><select onchange="setOrderStatus('${esc(o.id)}',this.value)">${['Confirmed','Packed','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders yet.</div>'}</div>`}
function setOrderStatus(id,status){let orders=load('devkart_orders',[]),o=orders.find(x=>x.id===id);if(o){o.status=status;save('devkart_orders',orders);toast('Order status updated')}}
function customerPanel(users){return `<div class="panel"><div class="panelhead"><h2 style="margin:0">Customers (${users.length})</h2><button class="btn" onclick="render()">Refresh</button></div>${users.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Joined</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.name||'—')}</b></td><td>${esc(u.m||'')}</td><td>${esc(u.e||'—')}</td><td>Registered account</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No customers registered yet.</div>'}</div>`}
render();
</script>
</body></html>
